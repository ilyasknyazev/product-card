<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: #f2f4f8;
        text-align: center;
      }

      h1 {
        margin-bottom: 30px;
      }

      .message {
        margin: 30px auto;
        font-size: 20px;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #3478f6;
        color: white;
      }

      button:hover {
        opacity: 0.9;
      }

      .userContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 40px;
      }

      .user-card {
        width: 250px;
        padding: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      .user-card h3 {
        color: #3478f6;
      }

      .delete-btn {
        background: #e53935;
      }

      .delete-card {
        margin-top: 10px;
        padding: 8px 12px;
        background: #e53935;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="message" class="message">Данные загружаются...</div>

    <div class="buttons">
      <button id="getAll">Получить все данные</button>
      <button id="deleteAll" class="delete-btn">Удалить все данные</button>
    </div>

    <div id="userContainer" class="userContainer"></div>

    <script src="async.js"></script>
  </body>
</html>
