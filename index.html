<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main">
        <div class="container">
            <h1 class="title">Выбери свой продукт</h1>
            <div class="block-buttons">
                <button id="change-color-all-card" class="button">Сменить цвет всех карточек</button>
                <button id="change-color-first-card" class="button">Сменить цвет первой карточки</button>
                <button id="open-google-page" class="button">Открыть страницу Google.com</button>
                <button id="output-console-log" class="button">Вывести сообщение в консоль</button>
                <button id="change-bgColor" class="button">Сменить цвет кнопки</button>
            </div>
            
            <ul class="products-list"></ul>
            
            <template id="product-template">
                <li class="product-card">
                    <img class="product-card__image" src="" alt="">

                    <span class="product-card__use"></span>

                    <h2 class="product-card__title"></h2>

                    <p class="product-card__description"></p>

                    <span class="product-card__compound">Состав:</span>

                    <ul class="product-card__components"></ul>

                    <div class="product-card__purchase">
                        <b class="product-card__sell">Цена:</b>
                        <span class="product-card__price"></span>
                    </div>
                </li>
            </template>
        
        </div>
    </main>

    <footer class="footer">
        <div class="footer__container container">

            <section class="footer__brand">
                <h2 class="footer__title">Product Cards</h2>
                <p class="footer__text">
                    У Нас Самые Лучшие Продукты Для Кожи!
                </p>
                <div class="socials">
                    <a class="socials__link" href="#" aria-label="Telegram">
                        <img class="socials__icon" src="images/telegram_icon.svg" alt="Telegram">
                    </a>

                    <a class="socials__link" href="#" aria-label="VK">
                        <img class="socials__icon" src="images/vk_icon.svg" alt="VK">
                    </a>
                </div>
            </section>

            <section class="footer__subscribe">
                <h2 class="footer__subtitle">
                    Подпишись на наши акции:
                </h2>
                <form class="subscribe-form" id="subscribe-form">
                    <input class="subscribe-form__input" name="email" type="email" placeholder="Введи Email..." required>

                    <button class="subscribe-form__button" type="submit">Подписаться</button>
                </form>
            </section>

            <nav class="footer__nav">
                <h2 class="footer__subtitle">Быстрые ссылки</h2>
                <ul class="footer__list">
                    <li class="footer__item">
                        <a class="footer__link" href="#">Главная</a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link" href="#">Магазин</a>
                    </li>
                    <li class="footer__item">
                        <a class="footer__link" href="#">Контакты</a>
                    </li>
                </ul>
            </nav>

        </div>

        <div class="footer__bottom">
            <div class="footer__line"></div>
            <p class="footer__copyright">
                www.product-cards.com &copy;all right reserve
            </p>
        </div>
    </footer>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
    <script type="module" src="homework-11.js"></script>
</body>
</html>
